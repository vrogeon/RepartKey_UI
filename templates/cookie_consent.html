<!-- templates/cookie_consent.html -->
<div class="cookie-consent-banner" id="cookieConsentBanner" style="position: fixed; bottom: 0; left: 0; right: 0; background: #333; color: white; padding: 10px; text-align: center; z-index: 1000;">
    <p style="margin: 0;">
        Ce site utilise des cookies pour améliorer votre expérience.
        En continuant, vous acceptez notre <a href="/privacy" style="color: #4CAF50;">politique de confidentialité</a>.
    </p>
    <button onclick="acceptCookies()" style="background: #4CAF50; color: white; border: none; padding: 5px 15px; margin-left: 10px; cursor: pointer;">
        Accepter
    </button>
    <button onclick="declineCookies()" style="background: #f44336; color: white; border: none; padding: 5px 15px; margin-left: 10px; cursor: pointer;">
        Refuser
    </button>
</div>

<script>
    function acceptCookies() {
        document.cookie = "cookie_consent=accepted; path=/; max-age=" + 60*60*24*365;
        document.getElementById('cookieConsentBanner').style.display = 'none';
    }
    function declineCookies() {
        document.cookie = "cookie_consent=declined; path=/; max-age=" + 60*60*24*365;
        document.getElementById('cookieConsentBanner').style.display = 'none';
    }
    // Vérifie si l'utilisateur a déjà donné son consentement
    if (document.cookie.split(';').some(item => item.trim().startsWith('cookie_consent='))) {
        document.getElementById('cookieConsentBanner').style.display = 'none';
    }
</script>
